[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carecircle"
version = "0.1.0"
description = "CareCircle: an Alexa+ MCP server for checking on an ageing parent (Ring activity + medication log, consent before contacting anyone)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ritish Kurma" }]
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "starlette>=0.40",
  "fastapi>=0.110",
  "pydantic>=2.7",
  "mcp-consent-gate @ file:packages/mcp-consent-gate",
]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4"]

[project.scripts]
carecircle = "carecircle.server:main"
carecircle-alexa-sim = "alexa_sim.app:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["carecircle", "alexa_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:resources/subscribe is removed:Warning",
]
